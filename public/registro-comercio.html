<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senda - Registro de Comercio (con CSD)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="max-w-xl w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl my-8">
        <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-teal-400 to-emerald-500 mb-2 text-center">
            Registro de Comercio
        </h1>
        <p class="text-slate-400 text-sm text-center mb-6">
            Registra tu negocio con tus credenciales del SAT.
        </p>

        <!-- Formulario -->
        <form id="registerForm" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">RFC *</label>
                <input type="text" id="rfc" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-teal-500" placeholder="XEXX010101000">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Razón Social *</label>
                <input type="text" id="business_name" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-teal-500" placeholder="Mi Comercio S.A. de C.V.">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Régimen Fiscal *</label>
                    <select id="tax_regime" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-teal-500">
                        <option value="">Selecciona...</option>
                        <option value="601">601 - General de Ley Personas Morales</option>
                        <option value="612">612 - Personas Físicas con Actividades Empresariales</option>
                        <option value="626">626 - Régimen Simplificado de Confianza (RESICO)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Código Postal *</label>
                    <input type="text" id="zip_code" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-teal-500" placeholder="01000">
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Teléfono (WhatsApp) *</label>
                    <input type="text" id="phone" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-teal-500" placeholder="5215512345678">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Correo Electrónico *</label>
                    <input type="email" id="email" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-teal-500" placeholder="correo@dominio.com">
                </div>
            </div>

            <hr class="border-slate-800 my-4">
            <h3 class="text-sm font-bold text-teal-400 uppercase tracking-wider">Credenciales CSD (SAT)</h3>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Certificado (.cer) *</label>
                    <input type="file" id="cer_file" required class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-slate-800 file:text-teal-400 hover:file:bg-slate-700">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Llave Privada (.key) *</label>
                    <input type="file" id="key_file" required class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-slate-800 file:text-teal-400 hover:file:bg-slate-700">
                </div>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Contraseña de la Clave Privada *</label>
                <input type="password" id="csd_password" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-teal-500" placeholder="••••••••">
            </div>

            <button type="submit" id="submitBtn" class="w-full mt-6 bg-gradient-to-r from-teal-500 to-emerald-600 hover:from-teal-400 hover:to-emerald-500 text-slate-950 font-bold py-3 rounded-lg transition-all shadow-lg">
                Registrar Comercio
            </button>
        </form>

        <!-- Mensaje de Éxito / Error -->
        <div id="responseMessage" class="mt-4 text-center hidden font-bold"></div>
    </div>

    <script>
        const fileToBase64 = (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => {
                    const base64String = reader.result.split(',')[1];
                    resolve(base64String);
                };
                reader.onerror = (error) => reject(error);
            });
        };

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const msgDiv = document.getElementById('responseMessage');
            
            msgDiv.classList.add('hidden');
            btn.disabled = true;
            btn.textContent = 'Registrando comercio...';

            const cerFileInput = document.getElementById('cer_file').files[0];
            const keyFileInput = document.getElementById('key_file').files[0];
            const passwordVal = document.getElementById('csd_password').value;

            if (!cerFileInput || !keyFileInput || !passwordVal) {
                alert('⚠️ Los archivos .cer, .key y la contraseña son obligatorios.');
                btn.disabled = false;
                btn.textContent = 'Registrar Comercio';
                return;
            }

            try {
                const csd_cer_base64 = await fileToBase64(cerFileInput);
                const csd_key_base64 = await fileToBase64(keyFileInput);

                const payload = {
                    rfc: document.getElementById('rfc').value,
                    business_name: document.getElementById('business_name').value,
                    tax_regime: document.getElementById('tax_regime').value,
                    zip_code: document.getElementById('zip_code').value,
                    phone: document.getElementById('phone').value,
                    email: document.getElementById('email').value,
                    csd_cer_base64: csd_cer_base64,
                    csd_key_base64: csd_key_base64,
                    csd_password: passwordVal
                };

                const response = await fetch('/api/commerce/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (result.success) {
                    msgDiv.className = 'mt-4 text-center text-green-400 font-bold';
                    msgDiv.textContent = '✅ ¡Comercio registrado exitosamente! Redirigiendo...';
                    msgDiv.classList.remove('hidden');
                    
                    // Redirige directo a la página de éxito de pago con el ID del comercio
                    if (result.commerceId) {
                        setTimeout(() => {
                            window.location.href = `/payment/success?id=${result.commerceId}`;
                        }, 1000);
                    }
                } else {
                    msgDiv.className = 'mt-4 text-center text-red-400 font-bold';
                    msgDiv.textContent = '❌ Error: ' + (result.error || 'Error desconocido');
                    msgDiv.classList.remove('hidden');
                }
            } catch (err) {
                console.error(err);
                msgDiv.className = 'mt-4 text-center text-red-400 font-bold';
                msgDiv.textContent = '❌ No se pudo conectar al servidor en el puerto 8080.';
                msgDiv.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Registrar Comercio';
            }
        });
    </script>
</body>
</html>
